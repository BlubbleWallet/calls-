  /* Top bar */
  .top-bar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 28px 20px 0 20px;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(80,80,88,0.55);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    color: #ffffff;
    cursor: pointer;
  }

  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn img { width: 30px; height: 30px; filter: invert(1); }

  .call-info {
    text-align: center;
    padding-top: 6px;
  }

  .call-info .username {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: #ffffff;
  }

  .call-info .timer {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.5px;
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-circle {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: #f6c8cf;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }

  .avatar-circle span {
    font-size: 150px;
    font-weight: 800;
    color: #ffffff;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    transform: translateY(-2px);
  }

  /* Bottom control bar — simple blur, not full glassmorphism */
  .control-bar {
    position: relative;
    z-index: 2;
    margin: 0 16px 34px 16px;
    margin-bottom: max(34px, env(safe-area-inset-bottom, 34px));
    background: rgba(80,80,88,0.55);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-radius: 44px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ctrl-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: rgba(120,120,130,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ffffff;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .ctrl-btn:active { transform: scale(0.94); }

  .ctrl-btn svg { width: 26px; height: 26px; }
  .ctrl-btn img { width: 38px; height: 38px; filter: invert(1); }

  .ctrl-btn.active {
    background: #ffffff;
  }

  .ctrl-btn.active img {
    filter: none;
  }

  .ctrl-btn.end-call {
    background: #ff3b30;
  }

  .ctrl-btn.end-call img {
    filter: invert(1);
  }

  @media (max-width: 400px) {
    .avatar-circle { width: 220px; height: 220px; }
    .avatar-circle span { font-size: 130px; }
  }

  /* ===== Video call mode: self-view frame (rounded card, not full-screen takeover) ===== */
  .self-view-frame {
    position: absolute;
    right: 16px;
    top: 104px;
    width: 132px;
    height: 182px;
    border-radius: 24px;
    overflow: hidden;
    background: #1c1c1e;
    border: 2px solid rgba(255,255,255,0.22);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    z-index: 5;
    display: none;
    touch-action: none;
    cursor: grab;
    transition: width 0.28s ease, height 0.28s ease, border-radius 0.28s ease,
                left 0.28s ease, top 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
  }

  .self-view-frame.dragging {
    transition: none;
    cursor: grabbing;
  }

  .self-view-frame.large {
    width: 230px;
    height: 317px;
    border-radius: 28px;
  }

  /* Tap-to-hide: top bar & control bar fade out cleanly, tap again to bring back */
  .top-bar,
  .control-bar {
    transition: opacity 0.25s ease;
  }

  .call-screen.controls-hidden .top-bar,

  .call-screen.controls-hidden .control-bar {
    opacity: 0;
    pointer-events: none;
  }

  .call-screen.video-on .self-view-frame,
  .call-screen.video-fallback .self-view-frame {
    display: block;
  }

  .local-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    transform: scaleX(-1); /* mirror, feels natural for front camera */
  }

  .video-fallback-msg {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 12px;
    gap: 10px;
    background: #1c1c1e;
  }

  .self-avatar-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #a8c8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }

  .self-avatar-circle span {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  .video-fallback-msg p {
    font-size: 10.5px;
    line-height: 1.35;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
  }

  .call-screen.video-fallback .local-video { opacity: 0; }
  .call-screen.video-fallback .video-fallback-msg { display: flex; }

  .ctrl-btn#videoBtn.active {
    background: #ffffff;
  }

  /* Side controls shown over the camera preview: flip cam + effects.
     Positioned independently (not flex+gap) so spacing stays fixed
     no matter how the surrounding viewport behaves. */
  .video-side-controls {
    display: none;
  }

  .call-screen.video-on .video-side-controls { display: block; }

  .video-side-btn {
    position: absolute;
    right: 6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(20,20,22,0.65);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 6;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  #flipCamBtn { top: 6px; }
  #effectsBtn { top: 40px; }

  .video-side-btn:active { transform: scale(0.92); }
  .video-side-btn svg { width: 14px; height: 14px; }

  /* ===== Incoming call screen (separate screen, shown before a call connects) ===== */
  .incoming-screen {
    display: none;
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background-color: #0d0d0f;
    overflow: hidden;
    color: #ffffff;
    flex-direction: column;
  }

  .incoming-screen.show { display: flex; }

  .incoming-top {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 20px 0 20px;
  }

  .incoming-top .label {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.3px;
  }

  .incoming-mid {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .incoming-avatar-ring {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .incoming-avatar-ring::before,
  .incoming-avatar-ring::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    animation: pulseRing 1.8s ease-out infinite;
  }

  .incoming-avatar-ring::after { animation-delay: 0.6s; }

  @keyframes pulseRing {
    0%   { transform: scale(0.82); opacity: 0.8; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  .incoming-avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #f6c8cf;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }

  .incoming-avatar span {
    font-size: 100px;
    font-weight: 800;
    color: #ffffff;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  .incoming-name {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
  }

  .incoming-sub {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
  }

  .incoming-actions {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 40px;
    margin-bottom: 44px;
    margin-bottom: max(44px, env(safe-area-inset-bottom, 44px));
  }

  .incoming-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    touch-action: none;
    transition: transform 0.38s cubic-bezier(.22,.9,.4,1), opacity 0.38s ease;
  }

  .incoming-action.sliding {
    transition: none;
  }

  .slide-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .incoming-action.decline .slide-row { flex-direction: row; }
  .incoming-action.accept .slide-row { flex-direction: row-reverse; }

  .slide-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: slideHintBounce 1.4s ease-in-out infinite;
  }

  .incoming-action.decline .slide-hint { animation-name: slideHintBounceLeft; }
  .incoming-action.accept .slide-hint { animation-name: slideHintBounceRight; }

  .slide-hint svg { width: 18px; height: 18px; }
  .incoming-action.accept .slide-hint svg { transform: scaleX(-1); }

  .incoming-action.decline .slide-hint { color: rgba(255,138,130,0.85); }
  .incoming-action.accept .slide-hint { color: rgba(130,230,166,0.9); }
  .incoming-action.decline .slide-hint { animation-delay: 0.2s; }

  @keyframes slideHintBounceLeft {
    0%, 100% { transform: translateX(0); opacity: 0.35; }
    50% { transform: translateX(-6px); opacity: 1; }
  }

  @keyframes slideHintBounceRight {
    0%, 100% { transform: translateX(0); opacity: 0.35; }
    50% { transform: translateX(6px); opacity: 1; }
  }

  .incoming-action .btn-circle {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);

  .incoming-action .btn-circle svg { width: 28px; height: 28px; }

  .incoming-action.decline .btn-circle { background: #ff3b30; color: #fff; }
  .incoming-action.accept .btn-circle { background: #34c759; color: #fff; }

  .incoming-action span.action-label {
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
  }

  .video-side-btn.active {
    background: #ffffff;
    color: #0d0d0f;
  }

<script>
  const incomingScreen = document.getElementById('incomingScreen');
  const acceptIncomingBtn = document.getElementById('acceptIncomingBtn');
  const declineIncomingBtn = document.getElementById('declineIncomingBtn');
  const callScreenEl = document.getElementById('callScreen');

  function doAccept() {
    incomingScreen.classList.remove('show');
    callScreenEl.style.display = 'flex';
  }

  function doDecline() {
    incomingScreen.querySelector('.incoming-sub').textContent = 'Panggilan berakhir';
    incomingScreen.querySelector('.incoming-avatar-ring').style.animationPlayState = 'paused';
  }

  acceptIncomingBtn.addEventListener('click', doAccept);
  declineIncomingBtn.addEventListener('click', doDecline);

  /* ===== Geser ke samping untuk terima / tolak panggilan masuk =====
     direction: -1 = geser ke kiri (tolak), 1 = geser ke kanan (terima).
     Begitu lewat threshold, tombol "terangkat" terbang mulus ke arah
     geseran (fade + translate) dulu sebelum aksi benar-benar jalan —
     jadi nggak langsung nyemplung ke panggilan. */
  function setupSlideAction(wrapperEl, btnEl, onTrigger, direction) {
    const THRESHOLD = 50;
    const FLING = 170;
    let dragging = false;
    let triggered = false;
    let startX = 0;
    let pid = null;

    btnEl.addEventListener('pointerdown', (e) => {
      if (triggered) return;
      dragging = true;
      startX = e.clientX;
      pid = e.pointerId;
      wrapperEl.classList.add('sliding');
      btnEl.setPointerCapture(pid);
    });

    btnEl.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pid || triggered) return;
      let dx = (e.clientX - startX) * direction;
      dx = Math.max(0, Math.min(dx, THRESHOLD + 24));
      wrapperEl.style.transform = 'translateX(' + (direction * dx) + 'px)';
      wrapperEl.style.opacity = String(1 - (dx / (THRESHOLD + 24)) * 0.2);
      if (dx >= THRESHOLD) {
        triggered = true;
        dragging = false;
        commitSlide();
      }
    });

    function commitSlide() {
      wrapperEl.classList.remove('sliding');
      wrapperEl.style.transition =
        'transform 0.4s cubic-bezier(.22,.7,.35,1), opacity 0.4s ease';
      wrapperEl.style.transform = 'translateX(' + (direction * FLING) + 'px)';
      wrapperEl.style.opacity = '0';

      const onEnd = (ev) => {
        if (ev && ev.propertyName !== 'transform') return;
        wrapperEl.removeEventListener('transitionend', onEnd);
        onTrigger();
      };
      wrapperEl.addEventListener('transitionend', onEnd);
    }

    function release() {
      if (!dragging) return;
      dragging = false;
      wrapperEl.classList.remove('sliding');
      wrapperEl.style.transform = '';
      wrapperEl.style.opacity = '';
    }
    btnEl.addEventListener('pointerup', release);
    btnEl.addEventListener('pointercancel', release);
  }

  setupSlideAction(
    document.querySelector('.incoming-action.accept'),
    acceptIncomingBtn,
    doAccept,
    1
  );
  setupSlideAction(
    document.querySelector('.incoming-action.decline'),
    declineIncomingBtn,
    doDecline,
    -1
  );

  const speakerBtn = document.getElementById('speakerBtn');
  speakerBtn.addEventListener('click', () => {
    speakerBtn.classList.toggle('active');
  });

  const videoBtn = document.getElementById('videoBtn');
  const localVideo = document.getElementById('localVideo');
  const callScreen = document.querySelector('.call-screen');
  const flipCamBtn = document.getElementById('flipCamBtn');
  const effectsBtn = document.getElementById('effectsBtn');

  let videoStream = null;
  let videoOn = false;
  let currentFacing = 'user';
  const filters = [
    'none',
    'saturate(1.4) contrast(1.1) brightness(1.05)',
    'sepia(0.45) saturate(1.3)',
    'grayscale(1)'
  ];
  let filterIndex = 0;

  videoBtn.addEventListener('click', async () => {
    videoOn = !videoOn;
    videoBtn.classList.toggle('active', videoOn);
    callScreen.classList.toggle('video-on', videoOn);
    callScreen.classList.remove('video-fallback');

    if (videoOn) {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing },
          audio: false
        });
        localVideo.srcObject = videoStream;
        localVideo.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      } catch (err) {
        callScreen.classList.add('video-fallback');
      }
    } else {
      if (videoStream) {
        videoStream.getTracks().forEach((track) => track.stop());
        videoStream = null;
      }
      localVideo.srcObject = null;
      localVideo.style.filter = 'none';
      filterIndex = 0;
      effectsBtn.classList.remove('active');
    }
  });

  flipCamBtn.addEventListener('click', async () => {
    if (!videoOn) return;
    currentFacing = currentFacing === 'user' ? 'environment' : 'user';
    if (videoStream) {
      videoStream.getTracks().forEach((track) => track.stop());
    }
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing },
        audio: false
      });
      localVideo.srcObject = videoStream;
      localVideo.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      callScreen.classList.remove('video-fallback');
    } catch (err) {
      callScreen.classList.add('video-fallback');
    }
  });

  effectsBtn.addEventListener('click', () => {
    if (!videoOn) return;
    filterIndex = (filterIndex + 1) % filters.length;
    localVideo.style.filter = filters[filterIndex];
    effectsBtn.classList.toggle('active', filterIndex !== 0);
  });

  const micBtn = document.getElementById('micBtn');
  const micIcon = document.getElementById('micIcon');
  let muted = false;
  micBtn.addEventListener('click', () => {
    muted = !muted;
    if (muted) {
      micIcon.src = micBtn.dataset.off;
      micBtn.classList.add('active');
    } else {
      micIcon.src = micBtn.dataset.on;
      micBtn.classList.remove('active');
    }
  });

  /* ===== PIP self-view: draggable + tap untuk toggle ukuran kecil/besar ===== */
  const selfViewFrame = document.getElementById('selfViewFrame');
  let isLarge = false;
  let isDragging = false;
  let hasMoved = false;
  let pointerId = null;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;

  function frameToLeftTop() {
    const rect = selfViewFrame.getBoundingClientRect();
    const parentRect = callScreen.getBoundingClientRect();
    selfViewFrame.style.left = (rect.left - parentRect.left) + 'px';
    selfViewFrame.style.top = (rect.top - parentRect.top) + 'px';
    selfViewFrame.style.right = 'auto';
  }

  function clampFramePosition() {
    const parentRect = callScreen.getBoundingClientRect();
    const maxLeft = Math.max(0, parentRect.width - selfViewFrame.offsetWidth);
    const maxTop = Math.max(0, parentRect.height - selfViewFrame.offsetHeight);
    let left = parseFloat(selfViewFrame.style.left) || 0;
    let top = parseFloat(selfViewFrame.style.top) || 0;
    left = Math.min(Math.max(0, left), maxLeft);
    top = Math.min(Math.max(0, top), maxTop);
    selfViewFrame.style.left = left + 'px';
    selfViewFrame.style.top = top + 'px';
  }

  function toggleFrameSize() {
    isLarge = !isLarge;
    selfViewFrame.classList.toggle('large', isLarge);
    clampFramePosition();
  }

  selfViewFrame.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.video-side-btn')) return;
    frameToLeftTop();
    isDragging = true;
    hasMoved = false;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = parseFloat(selfViewFrame.style.left) || 0;
    startTop = parseFloat(selfViewFrame.style.top) || 0;
    selfViewFrame.setPointerCapture(pointerId);
    selfViewFrame.classList.add('dragging');
  });

  selfViewFrame.addEventListener('pointermove', (e) => {
    if (!isDragging || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
    if (!hasMoved) return;
    const parentRect = callScreen.getBoundingClientRect();
    const maxLeft = Math.max(0, parentRect.width - selfViewFrame.offsetWidth);
    const maxTop = Math.max(0, parentRect.height - selfViewFrame.offsetHeight);
    let newLeft = startLeft + dx;
    let newTop = startTop + dy;
    newLeft = Math.min(Math.max(0, newLeft), maxLeft);
    newTop = Math.min(Math.max(0, newTop), maxTop);
    selfViewFrame.style.left = newLeft + 'px';
    selfViewFrame.style.top = newTop + 'px';
  });

  function snapFrameToEdge() {
    const parentRect = callScreen.getBoundingClientRect();
    const margin = 16;
    const frameWidth = selfViewFrame.offsetWidth;
    const currentLeft = parseFloat(selfViewFrame.style.left) || 0;
    const centerX = currentLeft + frameWidth / 2;
    const goRight = centerX >= parentRect.width / 2;
    const targetLeft = goRight ? (parentRect.width - frameWidth - margin) : margin;

    selfViewFrame.style.transition =
      'left 0.32s cubic-bezier(.3,1.4,.5,1), width 0.25s ease, height 0.25s ease, border-radius 0.25s ease';
    selfViewFrame.style.left = targetLeft + 'px';

    const clearTransition = (ev) => {
      if (ev && ev.propertyName !== 'left') return;
      selfViewFrame.style.transition = '';
      selfViewFrame.removeEventListener('transitionend', clearTransition);
    };
    selfViewFrame.addEventListener('transitionend', clearTransition);
  }

  function endFrameDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    selfViewFrame.classList.remove('dragging');
    if (!hasMoved && !e.target.closest('.video-side-btn')) {
      toggleFrameSize();
    } else if (hasMoved) {
      snapFrameToEdge();
    }
  }

  selfViewFrame.addEventListener('pointerup', endFrameDrag);
  selfViewFrame.addEventListener('pointercancel', endFrameDrag);

  /* ===== Tap layar (bukan tombol/PIP) untuk sembunyikan/tampilkan semua kontrol ===== */
  callScreen.addEventListener('click', (e) => {
    if (
      e.target.closest('.self-view-frame') ||
      e.target.closest('.top-bar') ||
      e.target.closest('.control-bar')
    ) return;
    callScreen.classList.toggle('controls-hidden');
  });
</script>

</body>
</html>
